@let p = publi();

<article class="tile" [class.tile-mia]="esMia()">
  <div class="tile-cover" (click)="abrir.emit()" title="Ver publicacion">
    @if (p.imagenUrl) {
      <img class="tile-cover-img" [src]="p.imagenUrl" alt="" loading="lazy" />
    } @else {
      <div class="tile-cover-vacio">
        <span class="tile-cover-titulo">{{ p.titulo }}</span>
      </div>
    }

    @if (esMia()) {
      <button class="tile-eliminar" type="button" (click)="$event.stopPropagation(); eliminar.emit()" title="Eliminar">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 6L6 18M6 6l12 12"/>
        </svg>
      </button>
    }

    <span class="tile-tiempo">{{ tiempoRelativo() }}</span>
  </div>

  <div class="tile-cuerpo">
    @if (p.imagenUrl) {
      <h3 class="tile-titulo">{{ p.titulo }}</h3>
    }
    <p class="tile-descripcion">{{ p.descripcion }}</p>
  </div>

  <footer class="tile-pie">
    <div class="tile-autor">
      @if (p.autor.imagenPerfil) {
        <img class="tile-avatar" [src]="p.autor.imagenPerfil" alt="" />
      } @else {
        <div class="tile-avatar tile-avatar-vacio">{{ inicial() }}</div>
      }
      <span class="tile-username">{{ '@' + p.autor.nombreUsuario }}</span>
    </div>

    <button
      class="tile-like"
      type="button"
      [class.activo]="p.isLiked"
      (click)="likeToggle.emit()"
      [attr.aria-pressed]="p.isLiked"
    >
      @if (p.isLiked) {
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 21s-7-4.5-9.5-9C.5 8 3 4 7 4c2 0 3.5 1 5 3 1.5-2 3-3 5-3 4 0 6.5 4 4.5 8C19 16.5 12 21 12 21z"/>
        </svg>
      } @else {
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
        </svg>
      }
      <span>{{ p.likesCount }}</span>
    </button>
  </footer>
</article>
